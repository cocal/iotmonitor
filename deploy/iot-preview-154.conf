server {
    listen 127.0.0.1:18080;
    server_name _;

    root /var/www/iotmonitor-preview;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control no-store;
        return 200 "ok\n";
    }

    location = /api/v1/health {
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '{"status":"ok","source":"154-preview"}';
    }

    location = /api/v1/dlt645/frame {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://10.77.0.1:8080/api/dlt645/frames$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host monitor-center.internal;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/iot-preview-proxy-auth.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /api/v1/dlt645/status {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://10.77.0.1:8080/api/dlt645/status$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host monitor-center.internal;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/iot-preview-proxy-auth.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /api/v1/dlt645/trends {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://10.77.0.1:8080/api/dlt645/trends$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host monitor-center.internal;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/iot-preview-proxy-auth.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location = /api/v1/dlt645/summary {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://10.77.0.1:8080/api/dlt645/summary$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host monitor-center.internal;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/iot-preview-proxy-auth.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location ^~ /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
