# Dedicated compatibility ingress for ESP8266 Arduino Core 2.3.0 / axTLS.
# Include this server block inside the nginx http context on 192.144.142.237.
server {
    listen 8899 ssl;
    listen [::]:8899 ssl;
    server_name iot.ohmyskills.top;

    ssl_certificate     /etc/nginx/ssl/iotmonitor-8899-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/iotmonitor-8899-selfsigned.key;
    ssl_protocols TLSv1 TLSv1.2;
    ssl_ciphers "ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA:AES256-SHA:@SECLEVEL=0";
    ssl_conf_command MinProtocol TLSv1;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:iotmonitor_8899:1m;
    ssl_session_timeout 10m;

    location /api/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
