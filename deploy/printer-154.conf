server {
    listen 80;
    server_name printer.ohmyskills.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://printer.ohmyskills.top$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name printer.ohmyskills.top;

    include /etc/nginx/snippets/iot-under-printer.locations.conf;

    root /var/www/printer-docs;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/printer.ohmyskills.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/printer.ohmyskills.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }
}
