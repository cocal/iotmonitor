server {
    listen 80;
    listen [::]:80;
    server_name iot.ohmyskills.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name iot.ohmyskills.top;

    ssl_certificate /etc/ssl/cloudflare/ohmyskills.certs;
    ssl_certificate_key /etc/ssl/cloudflare/ohmyskills.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IoTCloudflareSSL:10m;
    ssl_session_timeout 10m;

    root /var/www/iotmonitor-preview;
    index index.html;
    charset utf-8;

    location = /favicon.ico {
        return 302 /favicon.svg;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control no-store;
        return 200 "ok\n";
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:18080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
