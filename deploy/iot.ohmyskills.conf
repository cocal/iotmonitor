# 104.223.72.245 / iot.ohmyskills.top: static dashboard, docs and raw-frame API.
# External API is standard HTTPS 443; Python listens only on 127.0.0.1:8090.
server {
    listen 80;
    listen [::]:80;
    server_name iot.ohmyskills.top;
    include /etc/nginx/cloudflare-gate.conf;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iot.ohmyskills.top;
    include /etc/nginx/cloudflare-gate.conf;

    ssl_certificate     /etc/ssl/cloudflare/ohmyskills.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ohmyskills.key;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_ciphers         PROFILE=SYSTEM;
    ssl_prefer_server_ciphers on;

    root /usr/local/codextestbot/iotmonitor/current;
    index index.html;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location ^~ /api/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /dashboard {
        return 301 /dashboard/;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location = /方案.md {
        default_type text/markdown;
        add_header Content-Disposition 'inline; filename="iotmonitor-plan.md"';
        add_header Cache-Control "no-cache";
    }
}
